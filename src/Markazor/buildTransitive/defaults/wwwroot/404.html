<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f4a56">
  <title>Page not found | Markazor</title>
  <link rel="icon" type="image/png" href="/assets/site-icon.png">
  <style>
    :root { color-scheme: light; --paper: #f4f1e9; --ink: #252721; --muted: #66665d; --line: #d6d3c8; --accent: #2f4a56; }
    * { box-sizing: border-box; }
    body { background: var(--paper); color: var(--ink); font: 1rem/1.8 "Segoe UI", system-ui, sans-serif; margin: 0; min-height: 100vh; }
    main { border-top: 1px solid var(--ink); margin: 7rem auto; max-width: 42rem; padding: 2rem 1.5rem; }
    img { border-radius: 6px; display: block; margin-bottom: 2rem; }
    .eyebrow { color: var(--accent); font: .7rem/1.5 Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font: 400 clamp(2.75rem, 10vw, 5rem)/1.05 "Palatino Linotype", Georgia, serif; letter-spacing: -.04em; margin: 1rem 0; }
    p { color: var(--muted); }
    a { color: var(--accent); display: inline-block; font-size: .85rem; padding-block: .75rem; text-underline-offset: .3em; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 520px) { main { margin-top: 4rem; } }
  </style>
</head>
<body>
  <main>
    <img src="/assets/site-icon.png" alt="" width="48" height="48">
    <p class="eyebrow">404 / A missing page</p>
    <h1>Page not found</h1>
    <p>The requested file or page does not exist.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
